name: "Actualizar Últimos Videos de YouTube"

on:
  schedule:
    - cron: '0 0 */2 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme-with-youtube:
    name: Update this repo's README with latest videos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: YouTube Cards
        uses: DenverCoder1/github-readme-youtube-cards@main
        with:
          channel_id: "UC-l_8ggAw-u4dJZtO05F5zQ"
          comment_tag_name: "YOUTUBE-CARDS"
          max_videos: 6

      - name: Commit y push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: actualizar últimos videos de YouTube"
          git push
