name: "Actualizar Últimos Videos de YouTube"
on:
  schedule:
    # Se ejecuta cada 2 días
    - cron: '0 0 */2 * *'
  workflow_dispatch:

jobs:
  update-readme-with-youtube:
    name: Update this repo's README with latest videos from mi Youtube Channel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@master
        with:
          max_post_count: "5"
          comment_tag_name: "YOUTUBE"
          # Usamos playlist_id y UU en lugar de channel_id y UC
          feed_list: "https://www.youtube.com/feeds/videos.xml?playlist_id=UU-l_8ggAw-u4dJZtO05F5zQ"
